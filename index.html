<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraHub - Nền Tảng Thương Mại Điện Tử Máy Ảnh & Thiết Bị Nhiếp Ảnh</title>
    <meta name="description" content="Chuyên máy ảnh Mirrorless, DSLR, Flycam DJI, Ống kính Sony Canon Nikon Fujifilm chính hãng giá tốt nhất.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-title" content="CameraHub">
    <meta name="theme-color" content="#e85d1b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <script>
        (function() {
            // Chặn và triệt tiêu lỗi phát sinh từ các Extension/tiện ích mở rộng của trình duyệt (content_main.js, v.v.)
            function isExtensionError(eventOrMsg, source) {
                var src = (source || (eventOrMsg && eventOrMsg.filename) || '').toLowerCase();
                var msg = (typeof eventOrMsg === 'string' ? eventOrMsg : (eventOrMsg && eventOrMsg.message) || '').toLowerCase();
                if (src.indexOf('content_main') !== -1 ||
                    src.indexOf('chrome-extension:') !== -1 ||
                    src.indexOf('moz-extension:') !== -1 ||
                    src.indexOf('safari-extension:') !== -1 ||
                    src.indexOf('extension') !== -1) {
                    return true;
                }
                if (msg.indexOf('istriggerkey') !== -1 ||
                    (msg.indexOf('tolowercase') !== -1 && src.indexOf('content_main') !== -1)) {
                    return true;
                }
                return false;
            }

            window.addEventListener('error', function(event) {
                if (isExtensionError(event)) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    return true;
                }
            }, true);

            window.addEventListener('unhandledrejection', function(event) {
                var reason = event && event.reason;
                var str = String(reason || '').toLowerCase();
                if (str.indexOf('content_main') !== -1 || str.indexOf('extension') !== -1 || str.indexOf('istriggerkey') !== -1) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            }, true);

            var origOnError = window.onerror;
            window.onerror = function(msg, url, line, col, error) {
                if (isExtensionError(msg, url)) {
                    return true;
                }
                if (typeof origOnError === 'function') {
                    return origOnError.apply(this, arguments);
                }
            };

            // Safeguard KeyboardEvent.prototype.key để không bao giờ trả về undefined khi bộ gõ tiếng Việt (Unikey/EVKey) gửi phím
            try {
                if (window.KeyboardEvent && window.KeyboardEvent.prototype) {
                    var desc = Object.getOwnPropertyDescriptor(window.KeyboardEvent.prototype, 'key');
                    if (desc && typeof desc.get === 'function') {
                        var origGet = desc.get;
                        Object.defineProperty(window.KeyboardEvent.prototype, 'key', {
                            get: function() {
                                var val = origGet.call(this);
                                return typeof val === 'string' ? val : '';
                            },
                            configurable: true,
                            enumerable: true
                        });
                    }
                }
            } catch (e) {}

            try {
                var isAdmin = window.location.pathname.indexOf('/admin') === 0;
                if (isAdmin) {
                    document.documentElement.classList.add('admin-mode');
                } else {
                    document.documentElement.classList.remove('admin-mode');
                }
                var key = isAdmin ? 'camerahub_admin_theme' : 'camerahub_client_theme';
                var saved = localStorage.getItem(key);
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-cream-50 text-ink-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/resources/js/main.tsx"></script>
</body>
</html>
