<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Viewfinder / Pentaprism Bump -->
    <rect x="186" y="90" width="140" height="70" rx="22" fill="#ffffff" />

    <!-- Main Camera Body -->
    <rect x="60" y="145" width="392" height="275" rx="52" fill="#ffffff" />

    <!-- Lens Outer Dark Barrel -->
    <circle cx="256" cy="290" r="80" fill="#181818" />

    <!-- Lens Inner Chrome / White Ring -->
    <circle cx="256" cy="290" r="54" fill="none" stroke="#ffffff" stroke-width="12" />

    <!-- Lens Center Aperture Glare -->
    <circle cx="234" cy="268" r="11" fill="#ffffff" fill-opacity="0.85" />

    <!-- Flash / Sensor Dot -->
    <circle cx="385" cy="205" r="15" fill="#181818" />
  </g>
</svg>
